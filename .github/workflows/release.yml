# Выпуск новой версии: создать релиз с тегом vX.Y.Z (Releases → Draft a new release)
# или  git tag v1.1.0 && git push --tags
# GitHub соберёт программу и установщик TasksSetup.exe, подставит версию из тега и приложит к релизу.
# Установленные программы увидят его при следующей проверке (раз в 6 часов или вручную в меню ⚙).
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:        # ручной запуск — просто сборка установщика без релиза
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Версия
        shell: python
        run: |
          import os, re
          s = open("task_tray.py", encoding="utf-8").read()
          if os.environ["GITHUB_REF_TYPE"] == "tag":
              v = os.environ["GITHUB_REF_NAME"].lstrip("v")
              s = re.sub(r'^VERSION = ".*?"', f'VERSION = "{v}"', s, count=1, flags=re.M)
              open("task_tray.py", "w", encoding="utf-8").write(s)
          else:
              v = re.search(r'^VERSION = "(.*?)"', s, re.M).group(1)
          open(os.environ["GITHUB_ENV"], "a").write(f"APP_VERSION={v}\n")
      - run: pip install PySide6 pyinstaller
      - name: Собрать программу (папка dist\Tasks)
        run: pyinstaller --noconfirm --noconsole --name Tasks --icon installer\tasks.ico task_tray.py
      - name: Собрать установщик
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$env:APP_VERSION" installer\tasks.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v6
        with:
          name: TasksSetup
          path: dist/TasksSetup.exe
      - name: Опубликовать релиз
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/TasksSetup.exe
            task_tray.py
          generate_release_notes: true
